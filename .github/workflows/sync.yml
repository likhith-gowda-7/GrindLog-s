name: 🔍 Code Quality & Safety

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    name: Code Quality Checks

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📚 Install dependencies
        run: npm ci

      - name: 🔒 Security audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: ✅ Verify CLI loads
        run: node src/cli.js --help

      - name: 🧪 Verify crypto module
        run: |
          node -e "
            import { encrypt, decrypt } from './src/auth/crypto.js';
            const msg = 'test';
            const enc = encrypt(msg);
            const dec = decrypt(enc);
            if (dec !== msg) { console.error('Crypto test FAILED'); process.exit(1); }
            console.log('✅ Crypto round-trip passed');
          "

      - name: 🔍 Check no secrets in config
        run: |
          node -e "
            import fs from 'fs';
            if (fs.existsSync('config.json')) {
              const config = JSON.parse(fs.readFileSync('config.json', 'utf8'));
              const hasSession = config.leetcode?.session;
              const hasApiKey = config.ai?.groqApiKey || config.ai?.geminiApiKey || config.ai?.openaiApiKey;
              if (hasSession || hasApiKey) {
                console.error('❌ SECURITY: Secrets found in config.json!');
                process.exit(1);
              }
            }
            console.log('✅ No secrets in config.json');
          "
